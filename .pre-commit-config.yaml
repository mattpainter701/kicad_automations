repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [check, --fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: validate-designs
        name: Validate changed design specs
        entry: python -m circuit_weaver validate --strict
        language: system
        files: '^(samples|src/circuit_weaver/examples)/.*\.yaml$'
        pass_filenames: true

      - id: sync-bundled-skills
        name: Keep _bundled_skills/ in sync with skills/
        entry: python scripts/sync_bundled_skills.py --check
        language: system
        files: '^(skills/|src/circuit_weaver/_bundled_skills/)'
        pass_filenames: false
