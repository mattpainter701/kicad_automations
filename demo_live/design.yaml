project: WiFi_Sensor_v1
description: Battery-powered WiFi environmental sensor with boost + buck power chain

metadata:
  author: Demo User
  target_bom_source: JLCPCB

power:
  - type: boost
    ref: U1
    ic: MT3608
    vin: 3.7
    vout: 5.0
    iout: 1.0
    rail_name: VBUS_5V
    vin_net: VBAT
    en_net: VBAT

  - type: buck
    ref: U2
    ic: AP62300
    vin: 5.0
    vout: 3.3
    iout: 0.8
    rail_name: VDD_3P3
    vin_net: VBUS_5V
    en_net: VBUS_5V

digital:
  - ic: ESP32-WROOM-32E
    ref: U3
    description: WiFi microcontroller, 240MHz, 4MB flash

sensors:
  - ic: BME280
    ref: U4
    description: Temperature/humidity/pressure sensor, I2C
