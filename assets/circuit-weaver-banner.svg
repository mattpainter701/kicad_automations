<svg width="1400" height="380" viewBox="0 0 1400 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#040d18"/>
      <stop offset="0.5" stop-color="#071626"/>
      <stop offset="1" stop-color="#040d18"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(220 190) scale(260 220)">
      <stop offset="0" stop-color="#0ef2c8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0ef2c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2d3f"/>
      <stop offset="1" stop-color="#0a2132"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ff8ff"/>
      <stop offset="1" stop-color="#2ef4b2"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8fffe"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8f9ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="chipGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .grid { stroke: rgba(80,220,255,0.08); stroke-width: 1; }
      .trace { stroke: rgba(60,240,200,0.30); stroke-width: 2; stroke-linecap: round; fill: none; }
      .traceD { stroke: rgba(60,240,200,0.15); stroke-width: 1.5; stroke-linecap: round; fill: none; }
      .dot { fill: rgba(60,240,200,0.65); filter: url(#glow); }
      .pin { stroke: rgba(100,248,255,0.7); stroke-width: 5; stroke-linecap: round; }
      .pin2 { stroke: rgba(100,248,255,0.45); stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1400" height="380" fill="url(#bg)"/>
  <rect width="1400" height="380" fill="url(#centerGlow)"/>

  <!-- Grid lines -->
  <g>
    <path class="grid" d="M0 76H1400M0 152H1400M0 228H1400M0 304H1400"/>
    <path class="grid" d="M100 0V380M200 0V380M300 0V380M400 0V380M500 0V380M600 0V380M700 0V380M800 0V380M900 0V380M1000 0V380M1100 0V380M1200 0V380M1300 0V380"/>
  </g>

  <!-- Circuit traces left side -->
  <g>
    <path class="trace" d="M0 95H80V130H120"/>
    <path class="trace" d="M0 260H60V218H100V190"/>
    <path class="traceD" d="M0 152H44V172H88"/>
    <path class="traceD" d="M130 340H80V300H30"/>
    <path class="traceD" d="M0 304H52V290"/>
    <path class="trace" d="M60 40H120V76H168"/>
    <circle class="dot" cx="80" cy="95" r="3.5"/>
    <circle class="dot" cx="60" cy="260" r="3.5"/>
    <circle class="dot" cx="44" cy="152" r="3"/>
    <circle class="dot" cx="80" cy="300" r="3"/>
    <circle class="dot" cx="120" cy="76" r="3"/>
  </g>

  <!-- Circuit traces right side -->
  <g transform="translate(1400, 0) scale(-1, 1)">
    <path class="trace" d="M0 95H80V130H120"/>
    <path class="trace" d="M0 260H60V218H100V190"/>
    <path class="traceD" d="M0 152H44V172H88"/>
    <path class="traceD" d="M130 340H80V300H30"/>
    <path class="traceD" d="M0 304H52V290"/>
    <path class="trace" d="M60 40H120V76H168"/>
    <circle class="dot" cx="80" cy="95" r="3.5"/>
    <circle class="dot" cx="60" cy="260" r="3.5"/>
    <circle class="dot" cx="44" cy="152" r="3"/>
    <circle class="dot" cx="80" cy="300" r="3"/>
    <circle class="dot" cx="120" cy="76" r="3"/>
  </g>

  <!-- IC Chip illustration (left side, centered vertically) -->
  <g transform="translate(220 190)">
    <!-- Outer ring glow -->
    <circle cx="0" cy="0" r="90" fill="rgba(14,242,200,0.04)" stroke="rgba(14,242,200,0.12)" stroke-width="1.5"/>
    <!-- Chip body -->
    <rect x="-52" y="-52" width="104" height="104" rx="12" fill="url(#chipGrad)" stroke="url(#accent)" stroke-width="3" filter="url(#chipGlow)"/>
    <!-- Chip die -->
    <rect x="-34" y="-34" width="68" height="68" rx="7" fill="#0a1a28" stroke="rgba(60,240,200,0.40)" stroke-width="1.5"/>
    <!-- Die circuits -->
    <line x1="-20" y1="-20" x2="20" y2="-20" stroke="rgba(100,248,255,0.5)" stroke-width="1.5"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="rgba(100,248,255,0.5)" stroke-width="1.5"/>
    <line x1="-20" y1="20" x2="20" y2="20" stroke="rgba(100,248,255,0.5)" stroke-width="1.5"/>
    <line x1="-20" y1="-20" x2="-20" y2="20" stroke="rgba(100,248,255,0.5)" stroke-width="1.5"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="rgba(100,248,255,0.5)" stroke-width="1.5"/>
    <line x1="20" y1="-20" x2="20" y2="20" stroke="rgba(100,248,255,0.5)" stroke-width="1.5"/>
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="rgba(60,240,200,0.15)" stroke="rgba(60,240,200,0.6)" stroke-width="1.5"/>
    <!-- Pin 1 dot -->
    <circle cx="-42" cy="-42" r="4" fill="#2ef4b2" filter="url(#glow)"/>
    <!-- Pins - top -->
    <line class="pin" x1="-30" y1="-52" x2="-30" y2="-72"/>
    <line class="pin" x1="-10" y1="-52" x2="-10" y2="-72"/>
    <line class="pin" x1="10" y1="-52" x2="10" y2="-72"/>
    <line class="pin" x1="30" y1="-52" x2="30" y2="-72"/>
    <!-- Pins - bottom -->
    <line class="pin" x1="-30" y1="52" x2="-30" y2="72"/>
    <line class="pin" x1="-10" y1="52" x2="-10" y2="72"/>
    <line class="pin" x1="10" y1="52" x2="10" y2="72"/>
    <line class="pin" x1="30" y1="52" x2="30" y2="72"/>
    <!-- Pins - left -->
    <line class="pin" x1="-52" y1="-30" x2="-72" y2="-30"/>
    <line class="pin" x1="-52" y1="-10" x2="-72" y2="-10"/>
    <line class="pin" x1="-52" y1="10" x2="-72" y2="10"/>
    <line class="pin" x1="-52" y1="30" x2="-72" y2="30"/>
    <!-- Pins - right -->
    <line class="pin" x1="52" y1="-30" x2="72" y2="-30"/>
    <line class="pin" x1="52" y1="-10" x2="72" y2="-10"/>
    <line class="pin" x1="52" y1="10" x2="72" y2="10"/>
    <line class="pin" x1="52" y1="30" x2="72" y2="30"/>
    <!-- Pin traces going out -->
    <path class="traceD" d="M-30 -72V-90H-60V-130"/>
    <path class="traceD" d="M30 -72V-90H60V-110"/>
    <path class="traceD" d="M-72 -10H-100V-40"/>
    <path class="traceD" d="M72 10H110V40H140"/>
    <circle class="dot" cx="-60" cy="-90" r="3"/>
    <circle class="dot" cx="60" cy="-90" r="3"/>
    <circle class="dot" cx="-100" cy="-40" r="3"/>
    <circle class="dot" cx="110" cy="40" r="3"/>
  </g>

  <!-- Vertical divider -->
  <line x1="400" y1="50" x2="400" y2="330" stroke="rgba(60,240,200,0.18)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Main title block -->
  <g>
    <!-- CIRCUIT WEAVER wordmark -->
    <text font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="3" text-anchor="start" x="448" y="168" fill="url(#titleGrad)">CIRCUIT WEAVER</text>
    <!-- Teal underline accent -->
    <rect x="448" y="180" width="580" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>
    <!-- Subtitle -->
    <text font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" letter-spacing="0.5" text-anchor="start" x="450" y="226" fill="#7aecff">KiCad automation engine + workflow toolkit</text>
    <!-- Tagline -->
    <text font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="450" y="265" fill="rgba(180,240,255,0.65)">From design intent to quote-ready KiCad outputs — programmatic, validated, agent-compatible.</text>
  </g>

  <!-- Feature pills -->
  <g>
    <!-- Pill 1 -->
    <rect x="448" y="296" width="164" height="36" rx="18" fill="rgba(14,242,200,0.10)" stroke="rgba(14,242,200,0.45)" stroke-width="1.5"/>
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#2ef4b2" text-anchor="middle" x="530" y="319">SCHEMATIC GEN</text>
    <!-- Pill 2 -->
    <rect x="624" y="296" width="148" height="36" rx="18" fill="rgba(14,242,200,0.10)" stroke="rgba(14,242,200,0.45)" stroke-width="1.5"/>
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#2ef4b2" text-anchor="middle" x="698" y="319">VALIDATION</text>
    <!-- Pill 3 -->
    <rect x="784" y="296" width="148" height="36" rx="18" fill="rgba(14,242,200,0.10)" stroke="rgba(14,242,200,0.45)" stroke-width="1.5"/>
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#2ef4b2" text-anchor="middle" x="858" y="319">BOM + SOURCING</text>
    <!-- Pill 4 -->
    <rect x="944" y="296" width="160" height="36" rx="18" fill="rgba(14,242,200,0.10)" stroke="rgba(14,242,200,0.45)" stroke-width="1.5"/>
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#2ef4b2" text-anchor="middle" x="1024" y="319">AGENT-FRIENDLY</text>
  </g>

  <!-- Bottom caption line -->
  <text font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-anchor="start" x="450" y="360" fill="rgba(100,220,255,0.35)">PYTHON · FASTAPI · KICAD 10 · MIT LICENSE</text>
</svg>
