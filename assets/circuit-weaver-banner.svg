    <path class="web" d="M926 80L980 186L1010 252"/>
    <path class="web" d="M546 78L476 124L420 186"/>
    <path class="web" d="M854 78L924 124L980 186"/>
    <circle class="node" cx="700" cy="194" r="7"/>
    <circle class="node" cx="548" cy="78" r="5"/>
    <circle class="node" cx="852" cy="78" r="5"/>
    <circle class="node" cx="476" cy="124" r="4"/>
    <circle class="node" cx="924" cy="124" r="4"/>
    <circle class="node" cx="420" cy="186" r="4"/>
    <circle class="node" cx="980" cy="186" r="4"/>
  </g>

  <!-- chip spider -->
  <g transform="translate(700 180)">
    <ellipse cx="0" cy="-16" rx="56" ry="62" fill="#102738" stroke="url(#accent)" stroke-width="4"/>
    <rect x="-44" y="32" width="88" height="84" rx="16" fill="#0a2130" stroke="url(#accent)" stroke-width="4"/>
    <rect x="-28" y="48" width="56" height="56" rx="8" fill="#ffe98f" stroke="#fff7d1" stroke-width="4" filter="url(#softGlow)"/>
    <g fill="#14384a">
      <rect x="-56" y="66" width="10" height="8" rx="2"/>
      <rect x="46" y="66" width="10" height="8" rx="2"/>
      <rect x="-56" y="84" width="10" height="8" rx="2"/>
      <rect x="46" y="84" width="10" height="8" rx="2"/>
    </g>
    <path class="leg" d="M-44 44L-122 18L-178 -16"/>
    <path class="legThin" d="M-44 44L-122 18L-178 -16"/>
    <path class="leg" d="M-46 56L-132 56L-206 36"/>
    <path class="legThin" d="M-46 56L-132 56L-206 36"/>
    <path class="leg" d="M-42 74L-132 98L-190 132"/>
    <path class="legThin" d="M-42 74L-132 98L-190 132"/>
    <path class="leg" d="M-28 102L-98 142L-132 178"/>
    <path class="legThin" d="M-28 102L-98 142L-132 178"/>
    <path class="leg" d="M44 44L122 18L178 -16"/>
    <path class="legThin" d="M44 44L122 18L178 -16"/>
    <path class="leg" d="M46 56L132 56L206 36"/>
    <path class="legThin" d="M46 56L132 56L206 36"/>
    <path class="leg" d="M42 74L132 98L190 132"/>
    <path class="legThin" d="M42 74L132 98L190 132"/>
    <path class="leg" d="M28 102L98 142L132 178"/>
    <path class="legThin" d="M28 102L98 142L132 178"/>
    <path class="leg" d="M-12 116L-28 148"/>
    <path class="legThin" d="M-12 116L-28 148"/>
    <path class="leg" d="M12 116L28 148"/>
    <path class="legThin" d="M12 116L28 148"/>
    <circle cx="0" cy="-16" r="11" fill="#56f5dc" filter="url(#softGlow)"/>
    <path d="M-24 -62Q0 -98 24 -62" stroke="#ecfbff" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- title block -->
  <g transform="translate(700 352)">
    <rect x="-360" y="-58" width="720" height="92" rx="18" fill="rgba(4,16,25,0.7)" stroke="rgba(124,247,255,0.25)"/>
    <text class="title" text-anchor="middle" x="0" y="-2">CIRCUIT WEAVER</text>
    <text class="subtitle" text-anchor="middle" x="0" y="40">KiCad automation engine + workflow toolkit</text>
    <text class="small" text-anchor="middle" x="0" y="-80">PROGRAMMATIC CIRCUIT DESIGN • REVIEW • GENERATION • VALIDATION</text>
  </g>
</svg>
