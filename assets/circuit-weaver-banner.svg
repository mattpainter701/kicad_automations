<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06111d"/>
      <stop offset="0.45" stop-color="#0a1730"/>
      <stop offset="1" stop-color="#041019"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 150) rotate(90) scale(180 300)">
      <stop offset="0" stop-color="#56f5dc" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#56f5dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf7ff"/>
      <stop offset="1" stop-color="#4cf1b8"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .grid { stroke: rgba(126,236,255,0.14); stroke-width: 1.2; }
      .trace { stroke: rgba(126,236,255,0.35); stroke-width: 2.4; stroke-linecap: round; }
      .trace2 { stroke: rgba(111,255,201,0.28); stroke-width: 1.8; stroke-linecap: round; }
      .node { fill: #bfffff; filter: url(#softGlow); }
      .web { stroke: rgba(173,248,255,0.6); stroke-width: 2.2; stroke-linecap: round; }
      .chip { fill: #0c2731; stroke: url(#accent); stroke-width: 3; }
      .leg { stroke: url(#accent); stroke-width: 8; stroke-linecap: round; }
      .legThin { stroke: #e9fbff; stroke-width: 3; stroke-linecap: round; opacity: 0.92; }
      .title { font: 800 66px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; fill: #f4ffff; }
      .subtitle { font: 500 28px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; fill: #9fefff; }
      .small { font: 600 17px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; fill: #6cf0c8; }
    </style>
  </defs>

  <rect width="1400" height="420" fill="url(#bg)"/>
  <rect width="1400" height="420" fill="url(#glow)"/>

  <!-- background circuit field -->
  <g opacity="0.9">
    <path class="grid" d="M0 64H1400M0 140H1400M0 216H1400M0 292H1400M0 368H1400"/>
    <path class="grid" d="M120 0V420M320 0V420M520 0V420M720 0V420M920 0V420M1120 0V420M1320 0V420"/>
    <path class="trace" d="M40 88H170V130H260"/>
    <path class="trace" d="M1140 64H1270V150H1360"/>
    <path class="trace" d="M62 250H180V202H258V162"/>
    <path class="trace" d="M1040 300H1190V250H1304"/>
    <path class="trace2" d="M110 332H240V356H312V388"/>
    <path class="trace2" d="M1092 344H1188V310H1296V280"/>
    <path class="trace2" d="M380 38V82H430V110"/>
    <path class="trace2" d="M1022 46V98H962V126"/>
    <circle class="node" cx="170" cy="88" r="4"/>
    <circle class="node" cx="260" cy="130" r="4"/>
    <circle class="node" cx="1270" cy="64" r="4"/>
    <circle class="node" cx="62" cy="250" r="4"/>
    <circle class="node" cx="1304" cy="280" r="4"/>
  </g>

  <!-- spider web -->
  <g opacity="0.95">
    <path class="web" d="M700 44V194"/>
    <path class="web" d="M548 78L700 194L852 78"/>
    <path class="web" d="M476 124L700 194L924 124"/>
    <path class="web" d="M420 186L700 194L980 186"/>
    <path class="web" d="M390 252L700 194L1010 252"/>
