<svg width="960" height="1260" viewBox="0 0 960 1260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="1260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#040d18"/>
      <stop offset="0.5" stop-color="#061422"/>
      <stop offset="1" stop-color="#040d18"/>
    </linearGradient>

    <!-- Phase gradients -->
    <linearGradient id="phaseInput" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c2038"/>
      <stop offset="1" stop-color="#0e2844"/>
    </linearGradient>
    <linearGradient id="phaseEngine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#082a2a"/>
      <stop offset="1" stop-color="#0b3434"/>
    </linearGradient>
    <linearGradient id="phaseOutput" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#082818"/>
      <stop offset="1" stop-color="#0b3222"/>
    </linearGradient>

    <!-- Border accents -->
    <linearGradient id="borderInput" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ac8ff"/>
      <stop offset="1" stop-color="#2196e8"/>
    </linearGradient>
    <linearGradient id="borderEngine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ef9f9"/>
      <stop offset="1" stop-color="#0fc8c8"/>
    </linearGradient>
    <linearGradient id="borderOutput" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ef8a0"/>
      <stop offset="1" stop-color="#10c86e"/>
    </linearGradient>

    <!-- Number circles -->
    <radialGradient id="numInput" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1a6aaa"/>
      <stop offset="1" stop-color="#0d3d6b"/>
    </radialGradient>
    <radialGradient id="numEngine" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0e7878"/>
      <stop offset="1" stop-color="#064444"/>
    </radialGradient>
    <radialGradient id="numOutput" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0e7844"/>
      <stop offset="1" stop-color="#064428"/>
    </radialGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="arrowInput" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L10 6L1 11" stroke="#4ac8ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowEngine" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L10 6L1 11" stroke="#2ef9f9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowOutput" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L10 6L1 11" stroke="#2ef8a0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <style>
      .grid { stroke: rgba(80,200,255,0.06); stroke-width: 1; }
      .label { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="1260" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g>
    <path class="grid" d="M0 180H960M0 360H960M0 540H960M0 720H960M0 900H960M0 1080H960"/>
    <path class="grid" d="M96 0V1260M192 0V1260M288 0V1260M384 0V1260M480 0V1260M576 0V1260M672 0V1260M768 0V1260M864 0V1260"/>
  </g>

  <!-- Header -->
  <text class="label" font-size="28" font-weight="800" letter-spacing="1" fill="#e8ffff" text-anchor="middle" x="480" y="54">Circuit Weaver — Full Hardware Workflow</text>
  <text class="label" font-size="15" font-weight="400" fill="rgba(140,220,255,0.65)" text-anchor="middle" x="480" y="80">From design intent to quote-ready manufacturing outputs</text>
  <line x1="120" y1="94" x2="840" y2="94" stroke="rgba(60,200,255,0.20)" stroke-width="1"/>

  <!-- Phase labels (left column) -->
  <!-- INPUTS phase label -->
  <rect x="14" y="118" width="72" height="228" rx="8" fill="rgba(74,200,255,0.07)" stroke="rgba(74,200,255,0.20)" stroke-width="1.5"/>
  <text class="label" font-size="12" font-weight="700" letter-spacing="2" fill="#4ac8ff" text-anchor="middle" transform="translate(50 232) rotate(-90)">INPUTS</text>

  <!-- ENGINE phase label -->
  <rect x="14" y="370" width="72" height="468" rx="8" fill="rgba(46,249,249,0.07)" stroke="rgba(46,249,249,0.20)" stroke-width="1.5"/>
  <text class="label" font-size="12" font-weight="700" letter-spacing="2" fill="#2ef9f9" text-anchor="middle" transform="translate(50 604) rotate(-90)">ENGINE</text>

  <!-- OUTPUTS phase label -->
  <rect x="14" y="862" width="72" height="268" rx="8" fill="rgba(46,248,160,0.07)" stroke="rgba(46,248,160,0.20)" stroke-width="1.5"/>
  <text class="label" font-size="12" font-weight="700" letter-spacing="2" fill="#2ef8a0" text-anchor="middle" transform="translate(50 996) rotate(-90)">OUTPUTS</text>


  <!-- ─────────────────────────────────────────── -->
  <!-- STEP 1 — Requirements Capture -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="108" y="118" width="762" height="110" rx="14" fill="url(#phaseInput)" stroke="url(#borderInput)" stroke-width="2"/>
  <circle cx="156" cy="173" r="22" fill="url(#numInput)" filter="url(#glow)"/>
  <text class="label" font-size="18" font-weight="800" fill="#a8deff" text-anchor="middle" x="156" y="180">1</text>
  <text class="label" font-size="18" font-weight="700" fill="#ffffff" x="196" y="163">Requirements Capture</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(160,224,255,0.80)" x="196" y="187">Engineer + Codex / Claude define block intent, interfaces, power rails, buses,</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(160,224,255,0.80)" x="196" y="208">and circuit constraints — no hand-drawing every sheet from scratch.</text>
  <!-- tag -->
  <rect x="716" y="134" width="136" height="24" rx="6" fill="rgba(74,200,255,0.14)" stroke="rgba(74,200,255,0.35)" stroke-width="1"/>
  <text class="label" font-size="11" font-weight="600" letter-spacing="1" fill="#4ac8ff" text-anchor="middle" x="784" y="151">AI + ENGINEER</text>

  <!-- Arrow 1 → 2 -->
  <line x1="480" y1="228" x2="480" y2="280" stroke="#4ac8ff" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arrowInput)"/>
  <text class="label" font-size="11" fill="rgba(74,200,255,0.55)" text-anchor="middle" x="510" y="258">YAML spec</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- STEP 2 — Part Sourcing -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="108" y="282" width="762" height="84" rx="14" fill="url(#phaseInput)" stroke="url(#borderInput)" stroke-width="2"/>
  <circle cx="156" cy="324" r="22" fill="url(#numInput)" filter="url(#glow)"/>
  <text class="label" font-size="18" font-weight="800" fill="#a8deff" text-anchor="middle" x="156" y="331">2</text>
  <text class="label" font-size="18" font-weight="700" fill="#ffffff" x="196" y="315">Part Sourcing</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(160,224,255,0.80)" x="196" y="339">DigiKey, Mouser, LCSC workflows turn vague components into concrete MPNs,</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(160,224,255,0.80)" x="196" y="358">package choices, datasheets, and purchasing options.</text>
  <!-- Vendor tags -->
  <rect x="598" y="294" width="66" height="22" rx="5" fill="rgba(74,200,255,0.12)" stroke="rgba(74,200,255,0.30)" stroke-width="1"/>
  <text class="label" font-size="10" font-weight="700" fill="#4ac8ff" text-anchor="middle" x="631" y="309">DIGIKEY</text>
  <rect x="672" y="294" width="58" height="22" rx="5" fill="rgba(74,200,255,0.12)" stroke="rgba(74,200,255,0.30)" stroke-width="1"/>
  <text class="label" font-size="10" font-weight="700" fill="#4ac8ff" text-anchor="middle" x="701" y="309">MOUSER</text>
  <rect x="738" y="294" width="46" height="22" rx="5" fill="rgba(74,200,255,0.12)" stroke="rgba(74,200,255,0.30)" stroke-width="1"/>
  <text class="label" font-size="10" font-weight="700" fill="#4ac8ff" text-anchor="middle" x="761" y="309">LCSC</text>

  <!-- Arrow 2 → 3 -->
  <line x1="480" y1="366" x2="480" y2="388" stroke="#2ef9f9" stroke-width="2.5" marker-end="url(#arrowEngine)"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- STEP 3 — Canonical Spec + BOM -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="108" y="390" width="762" height="100" rx="14" fill="url(#phaseEngine)" stroke="url(#borderEngine)" stroke-width="2"/>
  <circle cx="156" cy="440" r="22" fill="url(#numEngine)" filter="url(#glow)"/>
  <text class="label" font-size="18" font-weight="800" fill="#a0fdfd" text-anchor="middle" x="156" y="447">3</text>
  <text class="label" font-size="18" font-weight="700" fill="#ffffff" x="196" y="428">Build the Canonical Circuit Spec</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(150,250,255,0.80)" x="196" y="452">circuit_weaver maintains part bindings, circuit blocks, support-circuit requirements,</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(150,250,255,0.80)" x="196" y="472">interfaces, and overrides in a single machine-readable YAML design IR.</text>
  <!-- Tag -->
  <rect x="694" y="406" width="158" height="24" rx="6" fill="rgba(46,249,249,0.12)" stroke="rgba(46,249,249,0.32)" stroke-width="1"/>
  <text class="label" font-size="11" font-weight="600" letter-spacing="1" fill="#2ef9f9" text-anchor="middle" x="773" y="423">DESIGN IR / BOM</text>

  <!-- Arrow 3 → 4 -->
  <line x1="480" y1="490" x2="480" y2="516" stroke="#2ef9f9" stroke-width="2.5" marker-end="url(#arrowEngine)"/>
  <text class="label" font-size="11" fill="rgba(46,249,249,0.55)" text-anchor="middle" x="510" y="507">normalize</text>

  <!-- ─────────────────────────────────────────── -->
  <!-- STEP 4 — Generate + Validate (CORE) -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="108" y="518" width="762" height="178" rx="14" fill="url(#phaseEngine)" stroke="url(#borderEngine)" stroke-width="2.5"/>
  <!-- "CORE ENGINE" badge -->
  <rect x="688" y="528" width="164" height="28" rx="8" fill="rgba(46,249,249,0.18)" stroke="rgba(46,249,249,0.50)" stroke-width="1.5"/>
  <text class="label" font-size="12" font-weight="800" letter-spacing="1.5" fill="#2ef9f9" text-anchor="middle" x="770" y="547">★ CORE ENGINE</text>
  <circle cx="156" cy="580" r="22" fill="url(#numEngine)" filter="url(#glow)"/>
  <text class="label" font-size="18" font-weight="800" fill="#a0fdfd" text-anchor="middle" x="156" y="587">4</text>
  <text class="label" font-size="18" font-weight="700" fill="#ffffff" x="196" y="567">Generate Schematics + Validate</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(150,250,255,0.80)" x="196" y="591">circuit_weaver emits .kicad_sch files, placement hints, review SVGs, and reports.</text>
  <!-- Sub-features -->
  <line x1="196" y1="608" x2="852" y2="608" stroke="rgba(46,249,249,0.18)" stroke-width="1"/>
  <!-- Auto support block -->
  <rect x="196" y="618" width="272" height="60" rx="8" fill="rgba(46,249,249,0.07)" stroke="rgba(46,249,249,0.22)" stroke-width="1"/>
  <text class="label" font-size="11" font-weight="800" letter-spacing="1" fill="#2ef9f9" x="214" y="638">AUTO SUPPORT CIRCUITRY</text>
  <text class="label" font-size="12" font-weight="400" fill="rgba(150,250,255,0.75)" x="214" y="656">Bypass caps, passives, topology</text>
  <text class="label" font-size="12" font-weight="400" fill="rgba(150,250,255,0.75)" x="214" y="672">motifs auto-generated</text>
  <!-- Strict validation block -->
  <rect x="484" y="618" width="368" height="60" rx="8" fill="rgba(46,249,249,0.07)" stroke="rgba(46,249,249,0.22)" stroke-width="1"/>
  <text class="label" font-size="11" font-weight="800" letter-spacing="1" fill="#2ef9f9" x="502" y="638">STRICT VALIDATION GATES</text>
  <text class="label" font-size="12" font-weight="400" fill="rgba(150,250,255,0.75)" x="502" y="656">Structural · Electrical · Implementation</text>
  <text class="label" font-size="12" font-weight="400" fill="rgba(150,250,255,0.75)" x="502" y="672">· Presentation</text>

  <!-- Arrow 4 → 5 -->
  <line x1="480" y1="696" x2="480" y2="724" stroke="#2ef9f9" stroke-width="2.5" marker-end="url(#arrowEngine)"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- STEP 5 — KiCad Review + Polish -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="108" y="726" width="762" height="100" rx="14" fill="url(#phaseEngine)" stroke="url(#borderEngine)" stroke-width="2"/>
  <circle cx="156" cy="776" r="22" fill="url(#numEngine)" filter="url(#glow)"/>
  <text class="label" font-size="18" font-weight="800" fill="#a0fdfd" text-anchor="middle" x="156" y="783">5</text>
  <text class="label" font-size="18" font-weight="700" fill="#ffffff" x="196" y="762">KiCad Review + Human Polish</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(150,250,255,0.80)" x="196" y="786">Generated schematics are typically</text>
  <text class="label" font-size="13" font-weight="700" fill="#2ef9f9" x="396" y="786">~90% complete</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(150,250,255,0.80)" x="514" y="786">for serious hardware work.</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(150,250,255,0.80)" x="196" y="808">The last pass is human: page aesthetics, editorial cleanup, final readability judgment.</text>
  <!-- Human tag -->
  <rect x="700" y="742" width="152" height="24" rx="6" fill="rgba(46,249,249,0.12)" stroke="rgba(46,249,249,0.32)" stroke-width="1"/>
  <text class="label" font-size="11" font-weight="600" letter-spacing="1" fill="#2ef9f9" text-anchor="middle" x="776" y="759">HUMAN IN KICAD</text>

  <!-- Arrow 5 → 6 -->
  <line x1="480" y1="826" x2="480" y2="856" stroke="#2ef8a0" stroke-width="2.5" marker-end="url(#arrowOutput)"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- STEP 6 — PCB Update + Route -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="108" y="858" width="762" height="100" rx="14" fill="url(#phaseOutput)" stroke="url(#borderOutput)" stroke-width="2"/>
  <circle cx="156" cy="908" r="22" fill="url(#numOutput)" filter="url(#glow)"/>
  <text class="label" font-size="18" font-weight="800" fill="#a0ffd0" text-anchor="middle" x="156" y="915">6</text>
  <text class="label" font-size="18" font-weight="700" fill="#ffffff" x="196" y="896">PCB Update + Route</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(150,255,200,0.80)" x="196" y="920">Pull the schematic into KiCad PCB, place parts, route critical nets manually.</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(150,255,200,0.80)" x="196" y="942">Use autoroute / Freerouting for non-critical nets where it actually helps.</text>
  <!-- Tag -->
  <rect x="694" y="874" width="158" height="24" rx="6" fill="rgba(46,248,160,0.12)" stroke="rgba(46,248,160,0.32)" stroke-width="1"/>
  <text class="label" font-size="11" font-weight="600" letter-spacing="1" fill="#2ef8a0" text-anchor="middle" x="773" y="891">KICAD PCB</text>

  <!-- Arrow 6 → 7 -->
  <line x1="480" y1="958" x2="480" y2="990" stroke="#2ef8a0" stroke-width="2.5" marker-end="url(#arrowOutput)"/>

  <!-- ─────────────────────────────────────────── -->
  <!-- STEP 7 — Quote-Ready Package -->
  <!-- ─────────────────────────────────────────── -->
  <rect x="108" y="992" width="762" height="96" rx="14" fill="url(#phaseOutput)" stroke="url(#borderOutput)" stroke-width="2.5"/>
  <!-- Star badge -->
  <rect x="672" y="1004" width="180" height="28" rx="8" fill="rgba(46,248,160,0.18)" stroke="rgba(46,248,160,0.50)" stroke-width="1.5"/>
  <text class="label" font-size="12" font-weight="800" letter-spacing="1" fill="#2ef8a0" text-anchor="middle" x="762" y="1023">★ FINAL DELIVERABLE</text>
  <circle cx="156" cy="1040" r="22" fill="url(#numOutput)" filter="url(#glow)"/>
  <text class="label" font-size="18" font-weight="800" fill="#a0ffd0" text-anchor="middle" x="156" y="1047">7</text>
  <text class="label" font-size="18" font-weight="700" fill="#ffffff" x="196" y="1028">Quote-Ready Manufacturing Package</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(150,255,200,0.80)" x="196" y="1052">BOMs, sourcing data, review artifacts, and KiCad files ready to hand</text>
  <text class="label" font-size="13" font-weight="400" fill="rgba(150,255,200,0.80)" x="196" y="1072">to fabrication vendors — PCBWay, JLCPCB, or your preferred fab.</text>

  <!-- Vendor output tags -->
  <rect x="196" y="1102" width="96" height="24" rx="6" fill="rgba(46,248,160,0.12)" stroke="rgba(46,248,160,0.32)" stroke-width="1"/>
  <text class="label" font-size="11" font-weight="700" letter-spacing="1" fill="#2ef8a0" text-anchor="middle" x="244" y="1119">PCBWAY</text>
  <rect x="304" y="1102" width="96" height="24" rx="6" fill="rgba(46,248,160,0.12)" stroke="rgba(46,248,160,0.32)" stroke-width="1"/>
  <text class="label" font-size="11" font-weight="700" letter-spacing="1" fill="#2ef8a0" text-anchor="middle" x="352" y="1119">JLCPCB</text>
  <rect x="412" y="1102" width="130" height="24" rx="6" fill="rgba(46,248,160,0.12)" stroke="rgba(46,248,160,0.32)" stroke-width="1"/>
  <text class="label" font-size="11" font-weight="700" letter-spacing="1" fill="#2ef8a0" text-anchor="middle" x="477" y="1119">GERBERS + BOM</text>
  <rect x="554" y="1102" width="96" height="24" rx="6" fill="rgba(46,248,160,0.12)" stroke="rgba(46,248,160,0.32)" stroke-width="1"/>
  <text class="label" font-size="11" font-weight="700" letter-spacing="1" fill="#2ef8a0" text-anchor="middle" x="602" y="1119">KICAD FILES</text>

  <!-- Bottom summary line -->
  <line x1="80" y1="1152" x2="880" y2="1152" stroke="rgba(100,220,255,0.14)" stroke-width="1"/>
  <text class="label" font-size="12" font-weight="600" letter-spacing="1.5" fill="rgba(120,220,255,0.40)" text-anchor="middle" x="480" y="1180">REQUIREMENTS → SOURCING → SPEC → GENERATE → REVIEW → PCB → FABRICATION</text>
  <text class="label" font-size="11" font-weight="400" fill="rgba(100,200,255,0.28)" text-anchor="middle" x="480" y="1204">circuit_weaver handles ~90% of the heavy lifting — KiCad handles the last editorial mile</text>

  <!-- Decorative corner traces -->
  <path d="M20 1260V1230H60V1200H100" stroke="rgba(46,248,160,0.18)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M940 1260V1230H900V1200H860" stroke="rgba(46,248,160,0.18)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M20 0V30H60V60H100" stroke="rgba(74,200,255,0.18)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M940 0V30H900V60H860" stroke="rgba(74,200,255,0.18)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
