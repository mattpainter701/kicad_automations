# Complex: ESP32 IoT sensor node with dual-rail power and BME280
# Demonstrates a full system — USB-C input, buck + LDO power, MCU, environmental sensor.
# Uses Sprint 41 pin_nets_extra / no_connects surgical overrides to wire the
# ESP32 to the BME280 over I2C and silence unused UART0 pins so the design
# meets the placement_readiness gate.
project: IoT_Sensor_Node
company: Demo Corp
description: WiFi-enabled environmental sensor — ESP32 + BME280 with dual-rail power

power:
  - type: buck
    ic: AP62300
    ref: U1
    vin: 5
    vout: 3.3
    iout: 2
    vin_net: VBUS_5V
    rail_name: VDD_3P3
    en_net: VBUS_5V
  - type: ldo
    ic: TLV75518
    ref: U2
    vin: 3.3
    vout: 1.8
    vin_net: VDD_3P3
    rail_name: VDD_1P8

digital:
  - ic: ESP32-WROOM-32E
    ref: U3
    # IO21 + IO22 are the canonical ESP32 I2C pins; wire them to the
    # shared bus that the BME280 uses.
    pin_nets_extra:
      "33": I2C_SDA
      "36": I2C_SCL
    # UART0 (pins 34/35) is reserved for programming; no header in this
    # design, so mark intentional no-connect instead of leaving dangling.
    no_connects: ["34", "35"]

sensors:
  - ic: BME280
    ref: U4
    # SDO selects the I2C address (tied to GND → 0x76). Route to GND so
    # the schematic is placement-ready rather than dangling on BME_SDO.
    power_pins_extra:
      "5": GND

connectors:
  - ic: USB-C-PWR
    ref: J1
