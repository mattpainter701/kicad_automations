# USB-to-UART bridge with integrated ESD protection.
# Demonstrates power delivery + ESD-protected USB data with the
# Sprint 41 placement-readiness requirements satisfied via surgical pin
# overrides. Because the bundled USB-C-PWR connector is power-only, the
# USB D+/D- lines terminate at the ESD diodes; the UART TX/RX, modem
# control, and external-crystal pins are marked as intentional
# no-connects so the design is placement-ready as a minimal
# USB-power-only + UART-breakout demo.

project: USB_UART_Bridge
company: Demo Corp
description: USB-to-UART serial bridge with integrated ESD protection

power:
  - type: ldo
    ic: AP2112K-3.3
    ref: U1
    vin: 5
    vout: 3.3
    vin_net: VBUS_5V
    rail_name: VDD_3P3

usb:
  - type: usb_controller
    ic: CH340G
    ref: U2
    mode: device
    data_bus: UART
    # USB D+/D- land on the global USB nets that terminate at the
    # ESD diode. The template's default is an instance-scoped net,
    # which would leave both lines dangling.
    pin_nets_extra:
      "5": USB_DP
      "6": USB_DM
    # TXD/RXD (2/3) are UART breakout pins; crystal pins (7/8) are
    # unused (CH340G has internal clock); modem-control + R232
    # strap (9–15) aren't used on a UART-only board.
    no_connects: ["2", "3", "7", "8", "9", "10", "11", "12", "13", "14", "15"]

protection:
  - type: protection
    ic: PESD5V0S1BA
    ref: D1
    protect_net: USB_DM
    protection_type: esd
  - type: protection
    ic: PESD5V0S1BA
    ref: D2
    protect_net: USB_DP
    protection_type: esd

connectors:
  - ic: USB-C-PWR
    ref: J1
