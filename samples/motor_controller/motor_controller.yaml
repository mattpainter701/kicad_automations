# Motor control board with MCU and power delivery.
# Demonstrates 12V power management for motor control applications:
#   - 12V input (external power connector)
#   - AP62300 buck converter for clean 3.3V MCU rail (1A)
#   - STM32F103C8T6 ARM Cortex-M3 microcontroller
#   - Support for external H-bridge on 3.3V logic, 12V motor power
# BOOT0/RESET_N/SWDIO/SWCLK are marked as no-connects so the sample is
# placement-ready on its own; a real board would add a SWD header and
# pull resistors on BOOT0 / RESET_N.

project: Motor_Controller
company: Demo Corp
description: STM32-based motor controller with 12V-to-3.3V power delivery

power:
  - type: buck
    ic: AP62300
    ref: U1
    vin: 12
    vout: 3.3
    iout: 1
    vin_net: VIN_12V
    rail_name: VDD_3P3

digital:
  - ic: STM32F103C8T6
    ref: U2
    # STM32 programming + strap pins are intentionally no-connect on
    # this minimal demo; real boards add a 4-pin SWD header plus a 10k
    # pull-down on BOOT0 and a 10k pull-up + decoupling cap on RESET_N.
    no_connects: ["7", "34", "37", "44"]
