# Example: IoT sensor board with buck + LDO power, ESP32, BME280.
# Generate: circuit-weaver generate examples/iot_sensor.yaml -o output/
#
# This design demonstrates:
#   - Dual power rail (5V→3.3V buck, 3.3V→1.8V LDO)
#   - MCU with I2C sensor interface (auto-generated pull-ups)
#   - USB-C power input with CC resistors
#   - Sprint 41 placement-readiness: ESP32 I2C GPIOs wired via
#     pin_nets_extra; BME280 address-select tied to GND; ESP32 UART0
#     and BME280 SDO marked NC so the schematic is ready for placement.

project: IoT_Sensor
company: Demo Corp

power:
  - type: buck
    ic: AP62300
    ref: U1
    vin: 5
    vout: 3.3
    iout: 2
    vin_net: VBUS_5V
    rail_name: VDD_3P3
    en_net: VBUS_5V

  - type: ldo
    ic: TLV75518
    ref: U2
    vin: 3.3
    vout: 1.8
    vin_net: VDD_3P3
    rail_name: VDD_1P8

digital:
  - ic: ESP32-WROOM-32E
    ref: U3
    pin_nets_extra:
      "33": I2C_SDA
      "36": I2C_SCL
    no_connects: ["34", "35"]

sensors:
  - ic: BME280
    ref: U4
    power_pins_extra:
      "5": GND

connectors:
  - ic: USB-C-PWR
    ref: J1
