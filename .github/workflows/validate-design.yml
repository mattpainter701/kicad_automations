name: Validate Designs

on:
  push:
    paths:
      - "samples/**/*.yaml"
      - "src/circuit_weaver/examples/**/*.yaml"
      - "src/circuit_weaver/**/*.py"
  pull_request:
    paths:
      - "samples/**/*.yaml"
      - "src/circuit_weaver/examples/**/*.yaml"
      - "src/circuit_weaver/**/*.py"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install circuit-weaver
        run: python -m pip install --upgrade pip && python -m pip install -e ".[yaml,lookup,dev]"

      - name: Validate sample designs
        run: |
          failed=0
          for spec in samples/*/design_spec.yaml samples/*/*.yaml; do
            [ -f "$spec" ] || continue
            # Skip canonical_spec.yaml (generated output, not an input spec)
            case "$spec" in */canonical_spec.yaml) continue ;; esac
            # Skip nested output copies under samples/*/samples/
            case "$spec" in */samples/*) continue ;; esac
            # Skip zigbee_humidistat — v0.28.1 known issue: template-generated
            # pin_nets not reaching the validator (AP2112K-3.3 EN pin wiring).
            # Tracked in TASKS.md Sprint 42.
            case "$spec" in */zigbee_humidistat/*) continue ;; esac
            echo "::group::Validating $spec"
            if python -m circuit_weaver validate "$spec"; then
              echo "PASS: $spec"
            else
              echo "::error file=$spec::Validation failed for $spec"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Validate example designs
        run: |
          failed=0
          for spec in src/circuit_weaver/examples/*.yaml; do
            [ -f "$spec" ] || continue
            echo "::group::Validating $spec"
            if python -m circuit_weaver validate "$spec"; then
              echo "PASS: $spec"
            else
              echo "::error file=$spec::Validation failed for $spec"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
