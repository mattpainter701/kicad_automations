name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Sprint 35: Windows smoke test. Currently non-blocking while any
          # remaining Windows-only issues are triaged — flip once green.
          - os: windows-latest
            python-version: "3.12"
            windows_smoke: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and tooling
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        if: ${{ !matrix.windows_smoke }}
        run: python -m ruff check src tests

      - name: Pytest (full)
        if: ${{ !matrix.windows_smoke }}
        run: python -m pytest tests -q
        env:
          CI: true

      - name: Pytest (Windows smoke subset)
        if: ${{ matrix.windows_smoke }}
        continue-on-error: true
        run: |
          python -m pytest tests/test_cli_commands.py tests/test_cli_new_commands.py tests/test_doctor.py tests/test_skill_installer.py -q
          python -m circuit_weaver --version
        env:
          CI: true

  bundled-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify bundled skills match skills/
        run: python scripts/sync_bundled_skills.py --check
