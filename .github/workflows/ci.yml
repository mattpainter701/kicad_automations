name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m ruff check src tests

      - name: Pytest (full, including integration corpus)
        run: >-
          python -c "import os, pytest;
          os.environ.pop('CI', None);
          raise SystemExit(pytest.main(['tests', '-q']))"

      - name: CLI smoke test
        run: python -m circuit_weaver --version

  distribution:
    name: Build and test wheel contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distribution once
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2" "twine>=5,<7"
          python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Validate wheel payload
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = glob.glob("dist/*.whl")
          archives = glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1, wheels
          assert len(archives) == 1, archives
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
          assert "circuit_weaver/examples/iot_sensor.yaml" in names
          assert not any("__pycache__" in name or name.endswith((".pyc", ".pyo")) for name in names)
          with tarfile.open(archives[0], "r:gz") as source_archive:
              source_names = source_archive.getnames()
          assert any(name.endswith("/src/circuit_weaver/examples/iot_sensor.yaml") for name in source_names)
          assert not any(
              "__pycache__" in name or name.endswith((".pyc", ".pyo"))
              for name in source_names
          )
          PY

      - name: Install and test the exact wheel
        shell: bash
        run: |
          wheel=$(find dist -maxdepth 1 -name 'circuit_weaver-*.whl' -print -quit)
          test -n "$wheel"
          python -m venv .wheel-test
          .wheel-test/bin/python -m pip install --upgrade pip
          .wheel-test/bin/python -m pip install "${wheel}[test]"
          .wheel-test/bin/python -m pytest tests/test_release_contract.py tests/test_mcp_server.py -q

  bundled-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify bundled skills match skills/
        run: python scripts/sync_bundled_skills.py --check

  kicad-validation:
    name: KiCad ${{ matrix.kicad-major }} final-artifact validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kicad-major: ["8", "9", "10"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Circuit Weaver
        run: python -m pip install .

      - name: Install official KiCad stable PPA
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-${{ matrix.kicad-major }}.0-releases
          sudo apt-get update
          sudo apt-get install --yes kicad
          test -s /usr/share/kicad/template/fp-lib-table
          install -D --mode=0644 \
            /usr/share/kicad/template/fp-lib-table \
            "$HOME/.config/kicad/${{ matrix.kicad-major }}.0/fp-lib-table"
          kicad-cli version

      - name: Generate and verify representative final schematics
        run: |
          python -m circuit_weaver generate samples/iot_sensor_node/iot_sensor_node.yaml --output .ci-kicad/iot --require-kicad --no-svg --no-require-valid --no-readiness-gate
          python -m circuit_weaver generate samples/fpga_power_carrier/fpga_power_carrier.yaml --output .ci-kicad/fpga --require-kicad --no-svg --no-require-valid --no-readiness-gate

      - name: Require zero KiCad ERC violations
        run: |
          kicad-cli sch erc --exit-code-violations --format json --output .ci-kicad/iot/erc.json .ci-kicad/iot/IoT_Sensor_Node.kicad_sch
          kicad-cli sch erc --exit-code-violations --format json --output .ci-kicad/fpga/erc.json .ci-kicad/fpga/FPGA_Power_Carrier.kicad_sch
          test -s .ci-kicad/iot/erc.json
          test -s .ci-kicad/fpga/erc.json
